name: Build Xiaomi TV Custom APK
on:
  push:
    branches: [xiaomi-tv-custom-build]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "Android home: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          echo "SDK manager: $SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then echo 'sdkmanager unavailable'; exit 1; fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify installable APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | head -25
          echo "$BADGING" | grep -F "package: name='ru.tvcustom.launcher' versionCode='22' versionName='1.10.2'"
          sha256sum "$APK" > APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: XiaomiTVCustom-1.10.2-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK_SHA256.txt
