name: Screenshot Android TV Custom UI
on:
  push:
    branches: [xiaomi-tv-custom-build]
  workflow_dispatch:
concurrency:
  group: tv-screenshot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Enable hardware virtualization
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
          else
            echo "Emulator KVM unavailable"
          fi
      - name: Launch actual app and capture 1080p screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          avd-name: tv-launcher-qa
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            adb shell wm size 1920x1080 || true
            adb shell wm density 160 || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n ru.tvcustom.launcher/.MainActivity
            sleep 12
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml window.xml || true
            adb shell screencap -p /sdcard/tv_home.png
            adb pull /sdcard/tv_home.png tv_home.png
            adb shell input keyevent 82
            sleep 3
            adb shell screencap -p /sdcard/tv_controls.png
            adb pull /sdcard/tv_controls.png tv_controls.png
            adb shell input keyevent 4
            adb shell input keyevent 20
            adb shell input keyevent 20
            adb shell input keyevent 20
            adb shell input keyevent 20
            adb shell input keyevent 23
            sleep 2
            adb shell screencap -p /sdcard/tv_apps.png
            adb pull /sdcard/tv_apps.png tv_apps.png
            adb shell dumpsys activity activities | grep -E 'Resumed|mResumedActivity' > emulator_activity.txt || true
            adb logcat -d -s AndroidRuntime:E > android_crashes.txt || true
            test -s tv_home.png
            test -s tv_controls.png
            test -s tv_apps.png
            if grep -q "FATAL EXCEPTION" android_crashes.txt; then cat android_crashes.txt; exit 1; fi
      - name: Upload screenshot and startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiTVCustom-1.13.1-real-emulator-screenshots
          path: |
            tv_home.png
            window.xml
            tv_controls.png
            tv_apps.png
            emulator_activity.txt
            android_crashes.txt
